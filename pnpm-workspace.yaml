packages:
  - apps/*
  - packages/*
  - database
  - tests/*
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
  - framer-motion@13.5.0
  - motion-dom@13.5.0
  - motion-utils@13.5.0
  - motion@13.5.0
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - '@expo/ui@57.0.23'
  - expo-router@57.0.26
  - expo-crypto@57.0.4

# Security advisories with a patched release that a dependency's own range does not reach (pnpm audit, Phase 9).
overrides:
  '@graphql-tools/utils@<12.0.1': '12.0.4'
  'source-map-js@<1.2.2': '1.2.2'
