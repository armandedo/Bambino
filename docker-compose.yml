# Local development storage: PostgreSQL (database) and RustFS (S3-compatible object storage).
# Development only. Ports are bound to 127.0.0.1 so nothing is exposed to the network.
# Credentials default to development values; override them in your shell or a compose .env file.
#
#   docker compose up -d          start
#   docker compose down           stop (data is kept in named volumes)
#   docker compose down -v        stop and delete all data

name: bambino

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bambino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bambino_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bambino_dev}
    ports:
      # 5433 avoids clashing with a PostgreSQL already installed on the host (5432).
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bambino} -d ${POSTGRES_DB:-bambino_dev}']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. RustFS replaces MinIO, which no longer publishes free images.
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ROOT_USER:-bambino}
      RUSTFS_SECRET_KEY: ${STORAGE_ROOT_PASSWORD:-bambino_dev_password}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # web console
    volumes:
      - storage-data:/data
volumes:
  postgres-data:
  storage-data:
