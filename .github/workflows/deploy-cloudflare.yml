name: Deploy to Cloudflare

# Manual only. Needs repository secrets CLOUDFLARE_API_TOKEN (Workers, Hyperdrive, R2 edit) and
# CLOUDFLARE_ACCOUNT_ID, and the target environment's secrets set with `wrangler secret put` (docs/10-cloudflare.md).
# Migrations are NOT run here: apply them first, deliberately (docs/09-operations.md).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public build-time values for the website, from the GitHub environment's variables.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_MOCK_PAYMENTS: ${{ inputs.environment == 'preview' && 'true' || 'false' }}
      NEXT_PUBLIC_PREVIEW_BANNER: ${{ inputs.environment == 'preview' && 'true' || 'false' }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint
      - name: Deploy API Worker
        run: pnpm --filter @bambino/api exec wrangler deploy --env ${{ inputs.environment }}
      - name: Build and deploy website Worker
        run: pnpm --filter @bambino/web cf:build && pnpm --filter @bambino/web exec opennextjs-cloudflare deploy --env ${{ inputs.environment }}
      - name: Check the API is ready
        if: vars.API_ORIGIN != ''
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.API_ORIGIN }}/ready"
